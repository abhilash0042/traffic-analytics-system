# Traffic & Vehicle Analytics System - Pipeline Configuration
#
# Model strategy (major project — high accuracy):
#   - YOLO11 (Ultralytics) — better than YOLOv8 on same size tier
#   - Fine-tune from COCO pre-trained weights (never from scratch)
#   - YOLOv8-FDD (Paper 4): custom arch, cite in report only (~0.7% gain)
#
# Training guide: docs/TRAINING_PLAN.md
# Hardware profile: RTX 4050 (~6 GB VRAM) — batch sizes tuned below

paths:
  # Vehicle fine-tune eval + demo (UA-DETRAC-style CCTV traffic)
  video_input: "data/datasets/sample_videos/project_demo.mp4"
  video_output: "output/vehicle_project_demo_output.mp4"
  results_log: "output/vehicle_project_demo_results.json"
  models_dir: models
  datasets_dir: data/datasets
  weights_dir: weights

models:
  vehicle:
    finetuned: models/vehicle_detector.pt
    pretrained: weights/yolo11m.pt
    fallback: weights/yolo11s.pt
    confidence: 0.20
    # COCO class IDs — used when no fine-tuned vehicle_detector.pt exists
    classes: [2, 3, 5, 7]  # car, motorcycle, bus, truck
    # Fine-tuned UA-DETRAC classes: 0=bus, 1=car, 2=truck, 3=van
    finetuned_classes: [0, 1, 2, 3]
    motorcycle_fallback: true       # COCO yolo11s for bikes (helmet pipeline)
    motorcycle_confidence: 0.32

  plate:
    finetuned: models/plate_detector.pt
    pretrained: weights/yolo11s.pt
    fallback: weights/yolo11n.pt
    confidence: 0.15
    confidence_fallback: 0.05 # if no plate found at 0.15, try 0.05
    detect_imgsz: 640             # larger input helps small plates in video

  helmet:
    finetuned: models/helmet_detector.pt
    pretrained: weights/yolo11s.pt
    fallback: weights/yolo11n.pt
    confidence: 0.45

training:
  output_dir: runs/detect
  models_dir: models
  device: 0  # RTX 4050 — set to "cpu" only for debugging

  # Shared defaults (Paper 4 schedule + Ultralytics best practices)
  defaults:
    amp: true              # mixed precision — faster, less VRAM
    cache: false           # set true if you have spare RAM (speeds up epochs)
    workers: 4             # dataloader workers (reduce to 2 if CPU pegged)
    save_period: 5         # checkpoint every N epochs (crash safety)
    seed: 42
    cos_lr: true           # cosine learning rate decay
    optimizer: auto
    plots: true            # save loss/mAP curves in run folder
    val: true
    mosaic: 1.0            # mosaic augmentation (Paper 4)
    mixup: 0.0
    copy_paste: 0.0
    deterministic: false

  # Recommended training order: plate -> helmet -> vehicle
  plate:
    enabled: true
    base_weights: weights/yolo11s.pt
    dataset_dir: data/datasets/license_plates
    epochs: 50
    imgsz: 640
    batch: 16
    patience: 4
    close_mosaic: 10
    project: traffic_analytics
    name: plate_detector
    # Augmentation for Indian dashcam / CCTV (blur, night, rain, angle)
    hsv_h: 0.02
    hsv_s: 0.75
    hsv_v: 0.55
    degrees: 8.0
    translate: 0.15
    scale: 0.55
    fliplr: 0.5

  helmet:
    enabled: true
    base_weights: weights/yolo11s.pt
    dataset_dir: data/datasets/helmet_detection
    epochs: 50
    imgsz: 640
    batch: 16
    patience: 4
    close_mosaic: 10
    project: traffic_analytics
    name: helmet_detector
    # Indian traffic / dashcam augmentation
    hsv_h: 0.02
    hsv_s: 0.80
    hsv_v: 0.60
    degrees: 10.0
    translate: 0.18
    scale: 0.50
    fliplr: 0.5

  vehicle:
    enabled: true
    base_weights: weights/yolo11m.pt
    dataset_dir: data/datasets/vehicle_detection
    epochs: 100
    imgsz: 640
    batch: 8
    patience: 15
    close_mosaic: 10
    project: traffic_analytics
    name: vehicle_detector
    # UA-DETRAC / Indian highway & urban traffic augmentation
    hsv_h: 0.015
    hsv_s: 0.70
    hsv_v: 0.50
    degrees: 5.0
    translate: 0.12
    scale: 0.45
    fliplr: 0.5
    # After first vehicle train, refine with: python train_models.py --vehicles --continue-best

  # RTX 5060 upgrade profile (uncomment and swap when available):
  # vehicle_5060:
  #   base_weights: yolo11l.pt
  #   batch: 16
  #   epochs: 150
  #   patience: 30
  #   imgsz: 832

tracking:
  tracker: botsort                # botsort (recommended) or bytetrack
  tracker_conf: 0.35              # min confidence for tracker association
  tracker_iou: 0.45               # IoU threshold for tracker matching
  # Legacy (kept for reference, used by old DeepSORT):
  max_age: 30
  n_init: 3

anpr:
  ocr_languages: [en]
  min_plate_width: 32           # allow very small plates (upscaled before OCR)
  min_plate_height: 12
  upscale_min_width: 240        # bicubic/SR upscale tiny crops for OCR
  ocr_every_n_frames: 2         # Scan every 2nd frame (speeds up execution)
  vote_window: 15               # majority vote across recent frames
  multi_variant_ocr: true       # HIGH ACCURACY: try threshold / CLAHE / sharpen / invert
  dual_ocr: false               # Disabled: PaddlePaddle GPU DLL missing on Windows
  sr_enabled: false              # Disable Real-ESRGAN super-resolution for plate crops
  sr_model_path: weights/RealESRGAN_x4plus.pth
  sr_scale: 4                   # Upscale factor (4x is standard for RealESRGAN)
  sr_half: true                 # FP16 mode — fits in 6GB VRAM easily
  sr_min_width_trigger: 200     # Only run SR on crops narrower than this (px)
  fuzzy_validation: true        # tolerate OCR noise on Indian plates
  detect_full_frame_fallback: false
  plate_patterns:
    - "^[A-Z]{2}[0-9]{1,2}[A-Z]{1,3}[0-9]{1,4}$"
    - "^[A-Z]{2}[0-9]{2}[A-Z]{2}[0-9]{4}$"

preprocessing:
  bilateral_d: 11
  bilateral_sigma_color: 17
  bilateral_sigma_space: 17
  adaptive_block_size: 11
  adaptive_c: 2
  clahe_clip_limit: 3.0
  clahe_tile_size: 8
  # Video / dashcam enhancement (Indian low-light, motion blur)
  enable_video_enhance: false
  denoise_strength: 7
  sharpen_amount: 1.2
  low_light_clahe: true
  video_clahe_clip: 3.0

# Speed estimation (Paper 5: v = d / (N × Tᶠ), MAE = 3.16 km/h @ 30fps)
speed_estimation:
  enabled: true
  method: centroid            # changed from virtual_line to centroid to guarantee speed output
  virtual_line:
    start_y: 200                  # pixel row for start line (top of measurement zone)
    stop_y: 500                   # pixel row for stop line (bottom of measurement zone)
    distance_meters: 30.0         # real-world distance between lines (calibrate per camera)
  smoothing_window: 5             # frames to average speed over (reduces jitter)
  speed_limit_kmh: 60.0           # flag vehicles above this as speeding

# Road / lane segmentation for drivable-area inference
segmentation:
  enabled: true
  model: null                     # null = use detection accumulation; or path to weights/yolo11n-seg.pt
  static_roi: true                # true for fixed CCTV (run once, cache forever)
  roi_refresh_frames: 0           # 0 = never refresh; set >0 for dashcam
  warmup_frames: 15               # frames to accumulate vehicle positions before generating mask
  filter_off_road: true           # remove detections outside road mask
  action_zones:
    anpr_zone_lane: 0             # run ANPR only on closest lane (0 = closest)
    helmet_zone_lanes: [0, 1]     # run helmet check on these lanes
    anpr_zone_threshold: 0.0      # Scans plate ANYWHERE on screen to maximize chances

pipeline:
  device: 0                     # inference GPU (RTX 4050); use "cpu" to force CPU
  enable_anpr: true             # enabled for full run
  enable_helmet: true           # enabled for full run
  anpr_on_vehicle_crop: true
  vehicle_crop_padding: 0.15    # wider search around vehicle
  video_enhance_for_anpr: true  # HIGH ACCURACY: denoise + CLAHE before plate detect
  draw_plate_boxes: true        # show plate bounding boxes on output video
  draw_speed_lines: true        # show virtual speed estimation lines on video
  draw_road_mask: true          # show road mask overlay (debug; set true to visualize)
  log_every_n_frames: 30
  # Real-time CCTV target (~15–25 FPS on RTX 4050): enable_anpr false OR set anpr.ocr_every_n_frames: 5,
  # preprocessing.enable_video_enhance: false, anpr.multi_variant_ocr: false, use yolo11s/n helmet weights.
